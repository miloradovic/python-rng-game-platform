name: Container quality gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start the canonical stack
        run: docker compose up --build -d --wait

      - name: Apply and inspect migrations
        run: |
          docker compose run --rm app alembic upgrade head
          docker compose run --rm app alembic current

      - name: Validate empty-schema migration downgrade and restoration
        run: |
          docker compose run --rm app alembic downgrade base
          docker compose run --rm app alembic upgrade head

      - name: Verify formatting
        run: docker compose run --rm app ruff format --check .

      - name: Lint
        run: docker compose run --rm app ruff check .

      - name: Type check
        run: docker compose run --rm app mypy app tests tools

      - name: Detect metadata and migration drift
        run: docker compose run --rm app alembic check

      - name: Test
        run: docker compose run --rm app pytest

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes
