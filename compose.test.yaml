services:
  app:
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rng_app}:${POSTGRES_PASSWORD:-local-password}@db_test:5432/${TEST_POSTGRES_DB:-rng_game_platform_test}
      TEST_REDIS_URL: redis://redis:6379/1
    depends_on:
      db_test:
        condition: service_healthy
        restart: true

  db_test:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-rng_game_platform_test}
      POSTGRES_USER: ${POSTGRES_USER:-rng_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-password}
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend
    restart: "no"
    stop_grace_period: 30s

volumes:
  postgres_test_data:
