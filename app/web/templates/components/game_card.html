<article class="game-card game-card-{{ game.accent }}">
  <a class="game-card-link" href="{{ url_for('game_page', game_key=game.key) }}" aria-label="Play {{ game.name }} — {{ game.cadence }}">
    <div class="game-art" aria-hidden="true">
      <span class="cadence-badge">{{ game.cadence }}</span>
      {% if game.key == "daily_spin" %}
        <div class="mini-wheel"><span></span></div>
      {% elif game.key == "prediction_card" %}
        <div class="mini-cards"><span>◆</span><span>●</span></div>
      {% elif game.key == "skill_check" %}
        <div class="mini-sequence"><span>2</span><span>7</span><span>4</span></div>
      {% else %}
        <div class="mini-default">◇</div>
      {% endif %}
    </div>
    <div class="game-card-body">
      <h3>{{ game.name }}</h3>
      <p>{{ game.description }}</p>
      <span class="card-action">Play now <span aria-hidden="true">→</span></span>
    </div>
  </a>
</article>
