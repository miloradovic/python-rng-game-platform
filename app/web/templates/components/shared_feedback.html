<div class="network-banner" x-data="networkStatus" x-init="initialize" x-show="offline" role="status" aria-live="polite">
  You are offline. We will recover uncertain requests after you reconnect.
</div>

<div class="toast-region" x-data="toastRegion" x-init="initialize" aria-live="polite" aria-atomic="false">
  <template x-for="toast in toasts" x-bind:key="toast.id">
    <div class="toast" x-bind:class="toast.kind" x-text="toast.message"></div>
  </template>
</div>

<dialog class="identity-dialog" id="identity-dialog" x-data="identityManager" x-init="initialize">
  <div class="dialog-heading">
    <div>
      <p class="eyebrow"><span></span> Local demonstration</p>
      <h2>Choose a demo player</h2>
    </div>
    <button class="dialog-close" type="button" x-on:click="close" aria-label="Close player dialog">×</button>
  </div>
  <p>Your player ID is saved only in this browser. It is a demo boundary, not production authentication.</p>
  <form class="identity-form" x-on:submit.prevent="create" novalidate>
    <label for="display-name">Display name</label>
    <div>
      <input id="display-name" name="display_name" x-model="displayName" minlength="2" maxlength="50" autocomplete="nickname" required>
      <button class="button button-primary" type="submit" x-bind:disabled="busy">Create player</button>
    </div>
  </form>
  <p class="form-error" x-show="hasError" x-text="error" role="alert"></p>
  <div class="saved-players" x-show="hasPlayers">
    <h3>Saved in this browser</h3>
    <template x-for="player in players" x-bind:key="player.id">
      <button class="saved-player" type="button" x-on:click="select" x-bind:data-player-id="player.id">
        <span x-text="player.display_name"></span><small x-text="player.status"></small>
      </button>
    </template>
  </div>
  <div class="dialog-footer">
    <p x-show="limitedStorage">Private browsing has limited refresh recovery to this tab.</p>
    <button class="text-button danger" type="button" x-show="hasPlayers" x-on:click="clear">Clear saved players</button>
  </div>
</dialog>
