<section class="game-cartridge spin-cartridge" x-data="dailySpin" x-init="initialize" x-bind:aria-busy="busy">
  <div class="game-visual spin-stage">
    <div class="wheel-pointer" aria-hidden="true"></div>
    <svg id="daily-spin-wheel" class="prize-wheel" viewBox="0 0 240 240" role="img" aria-labelledby="wheel-title wheel-description">
      <title id="wheel-title">Weighted Daily Spin reward wheel</title>
      <desc id="wheel-description">Segment sizes represent the active server configuration weights.</desc>
      <template x-for="segment in segments" x-bind:key="segment.key">
        <g>
          <path x-bind:d="segment.path" x-bind:fill="segment.fill"></path>
          <text x-bind:x="segment.labelX" x-bind:y="segment.labelY" text-anchor="middle" dominant-baseline="middle" x-text="segment.percentage"></text>
        </g>
      </template>
      <circle cx="120" cy="120" r="28"></circle>
      <text class="wheel-center" x="120" y="120" text-anchor="middle" dominant-baseline="middle">SPIN</text>
    </svg>
    <ul class="wheel-legend" aria-label="Configured reward odds">
      <template x-for="segment in segments" x-bind:key="segment.key">
        <li><span x-text="segment.percentage"></span><strong x-text="segment.value"></strong> points</li>
      </template>
    </ul>
  </div>

  <div class="game-controls">
    <p class="game-status" role="status" aria-live="polite" x-text="message"></p>
    <p class="countdown" x-show="countdownLabel"><span x-text="countdownPrefix"></span> <strong x-text="countdownLabel"></strong></p>
    <button class="button button-primary game-action" type="button" x-on:click="action" x-bind:disabled="busy" x-show="canPlay" x-text="actionLabel"></button>

    <section class="result-panel" x-show="isResult" aria-labelledby="spin-result-title">
      <p class="result-kicker">Authoritative result</p>
      <h2 id="spin-result-title" tabindex="-1" x-text="resultLabel"></h2>
      <p x-text="rewardLabel"></p>
      <p class="verified-badge" x-show="isVerified"><span aria-hidden="true">✓</span> Independently verified on the server</p>
      <button class="button button-primary" type="button" x-show="canClaim" x-on:click="claim" x-bind:disabled="busy">Claim points</button>
      <details class="proof-details" x-show="hasProof">
        <summary>View complete fairness evidence</summary>
        <p>The commitment was published before evaluation. The revealed seed, client seed, mapping, and derived value reproduce this result.</p>
        <pre x-text="proofText"></pre>
      </details>
    </section>
  </div>
</section>
