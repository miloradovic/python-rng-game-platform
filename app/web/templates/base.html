<!doctype html>
<html lang="en" data-app-shell>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="Quick free-play games with point rewards and live weekly leaderboards.">
    <title>{% block title %}Arcade Proof{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
    <script defer src="{{ url_for('static', path='/js/core/state.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/core/api-client.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/core/player-store.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/core/preferences.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/core/operation-journal.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/core/final-score.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/core/clock.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/components/shared.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/components/leaderboard.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/games/daily-spin.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/games/prediction-card.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/games/skill-check.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/app.js') }}"></script>
    <script
      defer
      src="{{ url_for('static', path='/vendor/alpine-csp-3.15.12.min.js') }}"
      integrity="sha384-MKLWq9B+VC0W3U8kDIBEsSu8uCnQ1B0UQpRaB+F7uR5ocXFbymMUKuLRntu5LLdu"
    ></script>
  </head>
  <body x-data="shell" x-init="markReady">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ url_for('lobby') }}" aria-label="Arcade Proof home">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M20 2 35 10.5v19L20 38 5 29.5v-19L20 2Z"/>
            <path d="m13 23 4-11h6l4 11-7 5-7-5Z"/>
          </svg>
          <span><strong>Arcade</strong> Proof</span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-controls="primary-navigation"
          x-bind:aria-expanded="navOpen"
          x-on:click="toggleNavigation"
        >
          <span class="sr-only">Toggle navigation</span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
        <nav
          class="primary-nav"
          id="primary-navigation"
          aria-label="Primary navigation"
          x-bind:class="navClass"
        >
          <a href="{{ url_for('lobby') }}#games"{% if page == 'lobby' %} aria-current="page"{% endif %}>Games</a>
          <span class="demo-boundary">Free play</span>
        </nav>
        <div class="header-actions">
          <button class="icon-button" id="preferences-button" type="button" x-on:click="openPreferences" aria-label="Motion and sound settings" aria-haspopup="dialog">
            <span aria-hidden="true">⚙</span>
          </button>
          <button class="player-chip" id="player-menu-button" type="button" x-on:click="openIdentity" aria-haspopup="dialog">
            <span class="sr-only">Player selector:</span>
            <span class="player-chip-dot" aria-hidden="true"></span>
            <span x-text="playerLabel">Choose player</span>
          </button>
        </div>
      </div>
    </header>

    <noscript>
      <div class="noscript-notice">JavaScript is required to play. You can still browse this server-rendered lobby.</div>
    </noscript>

    <main id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>

    {% include "components/shared_feedback.html" %}

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>Free to play. Points have no cash value. No purchases or betting.</p>
      </div>
    </footer>
  </body>
</html>
